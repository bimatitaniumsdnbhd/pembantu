<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8" /> 
<meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
<title>Pembantu — order tracking for service shops</title> 
<link rel="preconnect" href="https://fonts.googleapis.com"> 
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"> 
<script type="module"> 
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; 
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; 
import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; 

// ---- 1. PASTE YOUR FIREBASE CONFIG HERE ---- 
const firebaseConfig = {
  apiKey: "AIzaSyAa2do4ngvHNVzf3qT1pxyc_HElAOeaj_g", 
  authDomain: "pembantu-be6fb.firebaseapp.com", 
  projectId: "pembantu-be6fb", 
  storageBucket: "pembantu-be6fb.firebasestorage.app", 
  messagingSenderId: "1080330834619", 
  appId: "1:1080330834619:web:2cf527ea841c9c5a2c0f9e", 
}; 
// --------------------------------------------- 

const app = initializeApp(firebaseConfig); 
const auth = getAuth(app); 
const db = getFirestore(app); 

window.__fb = { auth, db, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, fbSignOut, collection, doc, setDoc, getDoc, addDoc, updateDoc, query, where, onSnapshot }; 
window.__fbReady = true; 
window.dispatchEvent(new Event('fb-ready')); 
</script> 
<style> 
:root{--bg:#F2F4F0; --ink:#1C2B24; --sub:#5B685F; --line:#DCE1D8; --card:#FFFFFF; --indigo:#2F4B7C; --indigo-bg:#EAF0FA; --marigold:#E0932C; --green:#3F7A5B; --red:#C24B3F; --radius:14px; } 
*{box-sizing:border-box;} 
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;} 
.mono{font-family:'IBM Plex Mono',monospace;} 
.wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;} 
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;margin:0;} 
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;} 
.brand{display:flex;align-items:center;gap:10px;} 
.brand-mark{width:34px;height:34px;background:var(--indigo);border-radius:8px;position:relative;flex:none;} 
.brand-mark::after{content:'';position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--marigold) transparent transparent;border-top-right-radius:8px;} 
.brand h1{font-size:19px;} 
.brand span{display:block;font-size:12px;color:var(--sub);margin-top:1px;} 
.header-actions{display:flex;align-items:center;gap:10px;} 
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;} 
.tabs button{border:0.5px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;} 
.tabs button.active{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-bg);} 
input{font-family:'Inter';font-size:14px;padding:9px 12px;border-radius:10px;border:0.5px solid var(--line);background:#fff;color:var(--ink);width:100%;} 
input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(47,75,124,0.12);} 
label{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px;} 
.panel{background:var(--card);border:0.5px solid var(--line);border-radius:var(--radius);padding:22px;max-width:400px;margin:0 auto;} 
.btn{border:0.5px solid var(--indigo);background:var(--indigo);color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;} 
.btn.ghost{background:transparent;color:var(--indigo);} 
.btn.sub{background:var(--marigold);border-color:var(--marigold);color:#fff;} 
.btn.wa{background:var(--green);border-color:var(--green);} 
.btn.block{width:100%;margin-top:16px;} 
.err{color:var(--red);font-size:12px;margin-top:8px;} 
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;} 
@media(max-width:720px){.board{grid-template-columns:1fr;}} 
.col h3{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;} 
.ord{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;} 
.ord-top{display:flex;justify-content:space-between;align-items:baseline;} 
.ord-name{font-weight:500;font-size:14px;} 
.ord-item{font-size:13px;color:var(--sub);margin-bottom:8px;} 
.ord-actions{display:flex;gap:6px;flex-wrap:wrap;} 
.ord-actions button,.ord-actions a{flex:1;padding:7px 8px;font-size:12px;text-align:center;text-decoration:none;border-radius:8px;} 
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:13px;} 
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:0.5px solid var(--line);} 
th,td{text-align:left;padding:10px 14px;font-size:13px;border-bottom:0.5px solid var(--line);} 
th{color:var(--sub);font-weight:500;font-size:12px;text-transform:uppercase;} 
tr:last-child td{border-bottom:none;} 
.search{max-width:280px;margin-bottom:14px;} 
.signout{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;} 
.link-btn{background:none;border:none;color:var(--indigo);font-size:13px;cursor:pointer;margin-top:14px;display:block;width:100%;text-align:center;} 
</style> 
</head> 
<body> 
<div class="wrap" id="app"><div class="empty">Loading…</div></div> 
<script> 
const state = { session:null, shopData:null, tab:'new', orders:[], search:'', authMode:'signin', ready:false }; 
const draft = { name:'', phone:'', item:'', price:'', readyDate:'' }; 
const authDraft = { email:'', password:'', shopName:'' }; 
const STATUS_LABEL = { received:'Received', ready:'Ready for pickup', collected:'Collected' }; 
let unsubOrders = null; 

function fmt(n){ return 'RM ' + Number(n).toFixed(2); } 

function waLink(phone, text){
  let p = phone.replace(/\D/g,''); 
  if(p.startsWith('0')) p = '60' + p.slice(1); 
  else if(!p.startsWith('60')) p = '60' + p; 
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text); 
} 

function getTrialStatus(createdAt){
  if(!createdAt) return { active: true, daysLeft: 7 }; 
  const sevenDaysMs = 7 * 24 * 60 * 60 * 1000; 
  const expiresAt = createdAt + sevenDaysMs; 
  const now = Date.now(); 
  const daysLeft = Math.ceil((expiresAt - now) / (1000 * 60 * 60 * 24)); 
  return { active: now < expiresAt, daysLeft: daysLeft > 0 ? daysLeft : 0 }; 
} 

function boot(){
  const fb = window.__fb; 
  fb.onAuthStateChanged(fb.auth, async (user) => {
    state.session = user; 
    if(user){
      try {
        const docSnap = await fb.getDoc(fb.doc(fb.db, 'shops', user.uid)); 
        if (docSnap.exists()) { state.shopData = docSnap.data(); } 
      } catch(e) {} 
      const q = fb.query(fb.collection(fb.db, 'orders'), fb.where('shopId', '==', user.uid)); 
      if(unsubOrders) unsubOrders(); 
      unsubOrders = fb.onSnapshot(q, (snap) => {
        state.orders = snap.docs.map(d => ({ id:d.id, ...d.data() })); 
        render(); 
      }, (err) => {
        document.getElementById('app').innerHTML = '<div class="empty" style="color:var(--red)">Database error: ' + err.message + '</div>'; 
      }); 
    } else {
      if(unsubOrders) unsubOrders(); 
      state.orders = []; 
      state.shopData = null; 
    } 
    state.ready = true; 
    render(); 
  }); 
} 

if(window.__fbReady) boot(); 
else window.addEventListener('fb-ready', boot); 

function setTab(t){ state.tab = t; render(); } 
function setAuthMode(m){ state.authMode = m; render(); } 

async function signUp(){
  const fb = window.__fb; 
  const errBox = document.getElementById('auth-err'); 
  if(!authDraft.shopName.trim()){ errBox.textContent = 'Enter your shop name.'; return; } 
  if(!authDraft.email.trim() || !authDraft.password){ errBox.textContent = 'Enter email and password.'; return; } 
  try{
    const cred = await fb.createUserWithEmailAndPassword(fb.auth, authDraft.email.trim(), authDraft.password); 
    await fb.setDoc(fb.doc(fb.db, 'shops', cred.user.uid), { shopName: authDraft.shopName.trim(), createdAt: Date.now() }); 
  }catch(e){ errBox.textContent = e.message; } 
} 

async function signIn(){
  const fb = window.__fb; 
  const errBox = document.getElementById('auth-err'); 
  try{
    await fb.signInWithEmailAndPassword(fb.auth, authDraft.email.trim(), authDraft.password); 
  }catch(e){ errBox.textContent = e.message; } 
} 

async function signOutUser(){ await window.__fb.fbSignOut(window.__fb.auth); } 

async function resetPassword(){
  const fb = window.__fb; 
  const errBox = document.getElementById('auth-err'); 
  if(!authDraft.email.trim()){ 
    errBox.style.color='var(--red)'; 
    errBox.textContent = 'Enter your email above first, then click "Forgot password".'; 
    return; 
  } 
  try{
    await fb.sendPasswordResetEmail(fb.auth, authDraft.email.trim()); 
    errBox.style.color = 'var(--green)'; 
    errBox.textContent = 'Password reset email sent — check your inbox.'; 
  }catch(e){
    errBox.style.color = 'var(--red)'; 
    errBox.textContent = e.message; 
  } 
} 

async function submitOrder(){
  const fb = window.__fb; 
  const errBox = document.getElementById('new-err'); 
  if(!draft.name.trim()){ errBox.textContent = 'Enter customer name.'; return; } 
  if(!draft.phone.trim()){ errBox.textContent = 'Enter a WhatsApp number.'; return; } 
  if(!draft.item.trim()){ errBox.textContent = 'Describe the order.'; return; } 
  const price = parseFloat(draft.price); 
  if(!price || price <= 0){ errBox.textContent = 'Enter a valid price.'; return; } 
  errBox.textContent = ''; 
  try{
    await fb.addDoc(fb.collection(fb.db, 'orders'), {
      shopId: state.session.uid, 
      customerName: draft.name.trim(), 
      customerPhone: draft.phone.trim(), 
      item: draft.item.trim(), 
      price, 
      readyDate: draft.readyDate.trim(), 
      status: 'received', 
      createdAt: Date.now(), 
    }); 
  }catch(e){ errBox.textContent = e.message; return; } 
  draft.name=''; draft.phone=''; draft.item=''; draft.price=''; draft.readyDate=''; 
  state.tab = 'board'; 
  render(); 
} 

async function advanceStatus(id, status){
  const fb = window.__fb; 
  await fb.updateDoc(fb.doc(fb.db, 'orders', id), { status }); 
} 

function render(){
  const app = document.getElementById('app'); 
  if(!state.ready){ app.innerHTML = '<div class="empty">Loading…</div>'; return; } 
  
  const trial = getTrialStatus(state.shopData?.createdAt); 
  const trialBadge = trial.active ? `<span style="font-size:12px;color:var(--sub);">${trial.daysLeft} days left in trial</span>` : `<span style="font-size:12px;color:var(--red);font-weight:600">Trial expired</span>`; 
  
  const header = `<header> 
    <div class="brand"> 
      <div class="brand-mark"></div> 
      <div><h1>Pembantu</h1><span>Order tracking &amp; WhatsApp reminders for your service shop</span></div> 
    </div> 
    ${state.session ? ` 
    <div class="header-actions"> 
      ${trialBadge} 
      <a class="btn sub" href="https://buy.stripe.com/7sY9AV65r5lAbgZb7McMM01" target="_blank">Subscribe</a> 
      <button class="signout" onclick="signOutUser()">Sign out</button> 
    </div>` : ''} 
  </header>`; 
  
  if(!state.session){
    app.innerHTML = header + ` <div class="panel"> 
      <div class="tabs" style="justify-content:center"> 
        <button class="${state.authMode==='signin'?'active':''}" onclick="setAuthMode('signin')">Sign in</button> 
        <button class="${state.authMode==='signup'?'active':''}" onclick="setAuthMode('signup')">New shop</button> 
      </div> 
      ${state.authMode==='signup' ? `<label>Shop name</label><input value="${authDraft.shopName}" oninput="authDraft.shopName=this.value" placeholder="e.g. Empire Auto Detailers">` : ''} 
      <label>Email</label> 
      <input type="email" value="${authDraft.email}" oninput="authDraft.email=this.value" placeholder="shop@example.com"> 
      <label>Password</label> 
      <input type="password" value="${authDraft.password}" oninput="authDraft.password=this.value" placeholder="At least 6 characters"> 
      <div class="err" id="auth-err"></div> 
      <button class="btn block" onclick="${state.authMode==='signin' ? 'signIn()' : 'signUp()'}">${state.authMode==='signin' ? 'Sign in' : 'Create shop account'}</button> 
      ${state.authMode==='signin' ? `<button class="link-btn" onclick="resetPassword()">Forgot password?</button>` : ''} 
    </div>`; 
    return; 
  } 

  if(!trial.active){
    app.innerHTML = header + ` <div class="panel" style="text-align:center; max-width:480px;"> 
      <h2>Your 7-day free trial has ended</h2> 
      <p style="color:var(--sub); margin:12px 0 20px; font-size:14px; line-height:1.5;">Subscribe to Pembantu for RM49/month to continue managing customer orders and sending automated WhatsApp notifications.</p> 
      <a class="btn sub block" href="https://buy.stripe.com/7sY9AV65r5lAbgZb7McMM01" target="_blank">Subscribe Now</a> 
    </div>`; 
    return; 
  } 

  let html = header + `<div class="tabs"> 
    <button class="${state.tab==='new'?'active':''}" onclick="setTab('new')">New order</button> 
    <button class="${state.tab==='board'?'active':''}" onclick="setTab('board')">Orders (${state.orders.filter(o=>o.status!=='collected').length})</button> 
    <button class="${state.tab==='customers'?'active':''}" onclick="setTab('customers')">Customers</button> 
  </div>`; 

  if(state.tab === 'new'){
    html += `<div class="panel"> 
      <h3>New order</h3> 
      <label>Customer name</label><input value="${draft.name}" oninput="draft.name=this.value" placeholder="e.g. Encik Faizal"> 
      <label>WhatsApp number</label><input value="${draft.phone}" oninput="draft.phone=this.value" placeholder="e.g. 012-3456789"> 
      <label>Order details</label><input value="${draft.item}" oninput="draft.item=this.value" placeholder="e.g. Full interior detailing / Shoe restoration"> 
      <label>Price (RM)</label><input type="number" step="0.10" value="${draft.price}" oninput="draft.price=this.value" placeholder="e.g. 150.00"> 
      <label>Ready by</label><input value="${draft.readyDate}" oninput="draft.readyDate=this.value" placeholder="e.g. Today 6pm"> 
      <div class="err" id="new-err"></div> 
      <button class="btn block" onclick="submitOrder()">Save order</button> 
    </div>`; 
  } else if(state.tab === 'board'){
    const cols = ['received','ready','collected']; 
    html += state.orders.length===0 ? `<div class="empty">No orders yet.</div>` : `<div class="board">` + cols.map(col => {
      const items = state.orders.filter(o=>o.status===col); 
      return `<div class="col"><h3>${STATUS_LABEL[col]}</h3>` + (items.length===0 ? `<div class="empty">Empty</div>` : items.map(o => ` 
        <div class="ord"> 
          <div class="ord-top"><span class="ord-name">${o.customerName}</span><span class="mono" style="font-size:13px">${fmt(o.price)}</span></div> 
          <div class="ord-item">${o.item}${o.readyDate ? ' · ' + o.readyDate : ''}</div> 
          <div class="ord-actions"> 
            ${col==='received' ? `<button class="btn ghost" onclick="advanceStatus('${o.id}','ready')">Mark ready</button>` : ''} 
            ${col==='ready' ? `<a class="btn wa" target="_blank" href="${waLink(o.customerPhone, 'Hi ' + o.customerName + ', your order (' + o.item + ') is ready for pickup! Total: ' + fmt(o.price))}">WhatsApp</a><button class="btn ghost" onclick="advanceStatus('${o.id}','collected')">Collected</button>` : ''} 
          </div> 
        </div>`).join('')) + `</div>`; 
    }).join('') + `</div>`; 
  } else if(state.tab === 'customers'){
    const map = {}; 
    state.orders.forEach(o => {
      const key = o.customerPhone; 
      if(!map[key]) map[key] = { name:o.customerName, phone:o.customerPhone, count:0, total:0 }; 
      map[key].count += 1; 
      map[key].total += Number(o.price); 
    }); 
    let list = Object.values(map); 
    if(state.search.trim()){
      const q = state.search.toLowerCase(); 
      list = list.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q)); 
    } 
    html += `<input class="search" placeholder="Search by name or phone" value="${state.search}" oninput="state.search=this.value;render()">`; 
    html += list.length===0 ? `<div class="empty">No customers yet.</div>` : `<table><tr><th>Name</th><th>Phone</th><th>Orders</th><th>Total spent</th></tr>` + list.map(c => `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.count}</td><td class="mono">${fmt(c.total)}</td></tr>`).join('') + `</table>`; 
  } 
  app.innerHTML = html; 
} 
</script> 
<footer style="margin-top: 40px; text-align: center; font-size: 12px; color: var(--sub);"> 
  <a href="/terms.html" style="color: var(--sub); margin-right: 12px;">Terms of Service</a> 
  <a href="/privacy.html" style="color: var(--sub);">Privacy Policy</a> 
</footer> 
</body> 
</html>
